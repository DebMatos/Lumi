<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumi</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 650px;
        margin: 40px auto;
        padding: 16px;
        background: #20232a;
        color: #f5f5f5;
      }

      #messages {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 300px;
        margin-bottom: 20px;
      }

      .message {
        padding: 12px;
        border-radius: 12px;
        white-space: pre-wrap;
      }

      .user {
        background: #354052;
      }
      .lumi {
        background: #31483e;
      }

      form {
        display: flex;
        gap: 8px;
      }

      input {
        flex: 1;
        min-width: 0;
        padding: 12px;
        border-radius: 8px;
        border: none;
      }

      button {
        padding: 12px 18px;
        cursor: pointer;
      }
      header, .voice-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      header h1 { width: 100%; }
      button:disabled { cursor: default; opacity: .55; }
      button:enabled:hover { filter: brightness(.9); }
      :focus-visible { outline: 3px solid #91caff; outline-offset: 3px; }
      #status, #error { min-height: 1.5em; }
      #error { color: #ffb4ab; }
      .message { overflow-wrap: anywhere; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      html { scrollbar-color: #7d8899 #20232a; scrollbar-width: auto; scrollbar-gutter: stable; }
      @media (max-width: 480px) { form { flex-wrap: wrap; } input { flex-basis: 100%; } }
      @media (forced-colors: active) { html { scrollbar-color: auto; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Lumi</h1>
      <button id="newChat" type="button">Nova conversa</button>
      <button id="voiceToggle" type="button" aria-pressed="false">
        Voz desligada
      </button>
    </header>

    <p id="status" role="status" aria-live="polite">Inativo</p>
    <p id="error" role="alert"></p>
    <div class="voice-controls">
      <button id="cancelCapture" type="button" disabled>Cancelar gravação</button>
      <button id="stopSpeech" type="button" disabled>Parar voz</button>
    </div>
    <div id="messages"></div>

    <form id="chatForm" novalidate>
      <label class="sr-only" for="messageInput">Mensagem</label>
      <input id="messageInput" placeholder="Fala com a Lumi..." required />
      <button type="button" id="micButton" aria-label="Gravar áudio">🎙️</button>
      <button type="submit" id="sendButton">Enviar</button>
    </form>

    <script src="/chat.js" defer></script>
  </body>
</html>
