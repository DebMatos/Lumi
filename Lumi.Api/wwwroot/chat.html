<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumi</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 650px;
        margin: 40px auto;
        padding: 16px;
        background: #20232a;
        color: #f5f5f5;
      }

      #messages {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 300px;
        margin-bottom: 20px;
      }

      .message {
        padding: 12px;
        border-radius: 12px;
        white-space: pre-wrap;
      }

      .user {
        background: #354052;
      }
      .lumi {
        background: #31483e;
      }

      form {
        display: flex;
        gap: 8px;
      }

      input {
        flex: 1;
        min-width: 0;
        padding: 12px;
        border-radius: 8px;
        border: none;
      }

      button {
        padding: 12px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Lumi</h1>
      <button id="newChat" type="button">Nova conversa</button>
      <button id="voiceToggle" type="button" aria-pressed="false">
        Voz desligada
      </button>
    </header>

    <div id="messages"></div>

    <form id="chatForm">
      <input id="messageInput" placeholder="Fala com a Lumi..." required />
      <button type="button" id="micButton" aria-label="Gravar áudio">🎙️</button>
      <button type="submit">Enviar</button>
    </form>

    <script>
      const form = document.querySelector("#chatForm");
      const input = document.querySelector("#messageInput");
      const messages = document.querySelector("#messages");
      const button = form.querySelector("button");
      const voiceToggle = document.querySelector("#voiceToggle");
      let voiceEnabled = false;

      voiceToggle.addEventListener("click", () => {
        voiceEnabled = !voiceEnabled;

        voiceToggle.textContent = voiceEnabled ? "Voz ligada" : "Voz desligada";

        voiceToggle.setAttribute("aria-pressed", String(voiceEnabled));
      });

      const micButton = document.querySelector("#micButton");

      let mediaRecorder = null;
      let audioChunks = [];
      let audioStream = null;
      let isTranscribing = false;

      micButton.addEventListener("click", async () => {
        if (isTranscribing) return;

        // Parar a gravação
        if (mediaRecorder?.state === "recording") {
          mediaRecorder.stop();
          micButton.textContent = "A processar...";
          micButton.disabled = true;
          return;
        }

        try {
          audioStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });

          audioChunks = [];

          mediaRecorder = new MediaRecorder(audioStream);

          mediaRecorder.addEventListener("dataavailable", (event) => {
            if (event.data.size > 0) {
              audioChunks.push(event.data);
            }
          });

          mediaRecorder.addEventListener("stop", async () => {
            isTranscribing = true;
            audioStream?.getTracks().forEach((track) => track.stop());

            try {
              const audioBlob = new Blob(audioChunks, {
                type: mediaRecorder.mimeType,
              });

              const formData = new FormData();
              formData.append("audio", audioBlob, "recording.webm");

              const response = await fetch("/audio/transcribe", {
                method: "POST",
                body: formData,
              });

              if (!response.ok) {
                throw new Error("Erro ao transcrever áudio");
              }

              const result = await response.json();

              input.value = result.text;
              input.focus();
            } catch (error) {
              console.error(error);
              alert("Não foi possível transcrever o áudio.");
            } finally {
              isTranscribing = false;
              micButton.disabled = false;
              micButton.textContent = "🎙️";
              mediaRecorder = null;
            }
          });

          mediaRecorder.start();
          micButton.textContent = "⏹️";
        } catch (error) {
          console.error(error);
          audioStream?.getTracks().forEach((track) => track.stop());
          alert("Não foi possível aceder ao microfone.");
        }
      });

      function addMessage(content, role) {
        const element = document.createElement("div");
        element.className = `message ${role}`;
        element.textContent = content;
        messages.appendChild(element);
        return element;
      }
      let sessionId =
        sessionStorage.getItem("lumi-session") || crypto.randomUUID();

      sessionStorage.setItem("lumi-session", sessionId);
      const newChatButton = document.querySelector("#newChat");

      newChatButton.addEventListener("click", () => {
        sessionId = crypto.randomUUID();

        sessionStorage.setItem("lumi-session", sessionId);

        messages.innerHTML = "";
        input.value = "";
        input.focus();
      });
      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const message = input.value.trim();
        if (!message) return;

        addMessage(message, "user");
        input.value = "";
        button.disabled = true;

        const reply = addMessage("", "lumi");

        try {
          const response = await fetch("/chat/stream", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message, sessionId }),
          });

          if (!response.ok || !response.body) {
            throw new Error("Erro ao contactar a Lumi");
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();

     reply.textContent += decoder.decode();

if (voiceEnabled && reply.textContent.trim()) {
  try {
    await speakText(reply.textContent);
  } catch (error) {
    console.error("Erro ao reproduzir a voz:", error);
  }
}
          while (true) {
            const { done, value } = await reader.read();

            if (done) break;

            reply.textContent += decoder.decode(value, {
              stream: true,
            });

            reply.scrollIntoView({ block: "end" });
          }
          if (voiceEnabled && reply.textContent.trim()) {
            try {
              await speakText(reply.textContent);
            } catch (error) {
              console.error("Erro ao reproduzir a voz:", error);
            }
          }

          reply.textContent += decoder.decode();
        } catch (error) {
          reply.textContent += "\nErro de comunicação.";
          console.error(error);
        } finally {
          button.disabled = false;
          input.focus();
        }
      });

      async function speakText(text) {
        if (!text.trim()) return;

        const response = await fetch("/audio/speak", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });

        if (!response.ok) {
          throw new Error("Não foi possível gerar a voz.");
        }

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);
        const audio = new Audio(audioUrl);

        try {
          await new Promise((resolve, reject) => {
            audio.onended = resolve;
            audio.onerror = () => reject(new Error("Erro de reprodução."));
            audio.play().catch(reject);
          });
        } finally {
          URL.revokeObjectURL(audioUrl);
        }
      }
    </script>
  </body>
</html>
