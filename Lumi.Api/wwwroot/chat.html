<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumi</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 650px;
        margin: 40px auto;
        padding: 16px;
        background: #20232a;
        color: #f5f5f5;
      }

      #messages {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 300px;
        margin-bottom: 20px;
      }

      .message {
        padding: 12px;
        border-radius: 12px;
        white-space: pre-wrap;
      }

      .user {
        background: #354052;
      }
      .lumi {
        background: #31483e;
      }

      form {
        display: flex;
        gap: 8px;
      }

      input {
        flex: 1;
        min-width: 0;
        padding: 12px;
        border-radius: 8px;
        border: none;
      }

      button {
        padding: 12px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Lumi</h1>
      <button id="newChat" type="button">Nova conversa</button>
    </header>

    <div id="messages"></div>

    <form id="chatForm">
      <input id="messageInput" placeholder="Fala com a Lumi..." required />
      <button type="submit">Enviar</button>
    </form>

    <script>
      const form = document.querySelector("#chatForm");
      const input = document.querySelector("#messageInput");
      const messages = document.querySelector("#messages");
      const button = form.querySelector("button");

      function addMessage(content, role) {
        const element = document.createElement("div");
        element.className = `message ${role}`;
        element.textContent = content;
        messages.appendChild(element);
        return element;
      }
      let sessionId =
        sessionStorage.getItem("lumi-session") || crypto.randomUUID();

      sessionStorage.setItem("lumi-session", sessionId);
      const newChatButton = document.querySelector("#newChat");

      newChatButton.addEventListener("click", () => {
        sessionId = crypto.randomUUID();

        sessionStorage.setItem("lumi-session", sessionId);

        messages.innerHTML = "";
        input.value = "";
        input.focus();
      });
      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const message = input.value.trim();
        if (!message) return;

        addMessage(message, "user");
        input.value = "";
        button.disabled = true;

        const reply = addMessage("", "lumi");

        try {
          const response = await fetch("/chat/stream", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message, sessionId }),
          });

          if (!response.ok || !response.body) {
            throw new Error("Erro ao contactar a Lumi");
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();

          while (true) {
            const { done, value } = await reader.read();

            if (done) break;

            reply.textContent += decoder.decode(value, {
              stream: true,
            });

            reply.scrollIntoView({ block: "end" });
          }

          reply.textContent += decoder.decode();
        } catch (error) {
          reply.textContent += "\nErro de comunicação.";
          console.error(error);
        } finally {
          button.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
