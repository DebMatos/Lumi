<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#20232a" />
    <title>Lumi</title>
    <link rel="stylesheet" href="/chat.css" />
  </head>
  <body>
    <div class="chat-shell">
      <header class="chat-header">
        <h1>Lumi<span class="brand-dot" aria-hidden="true"></span></h1>
        <div class="header-actions">
          <button id="voiceToggle" type="button" aria-pressed="false">Voz desligada</button>
          <span class="header-divider" aria-hidden="true"></span>
          <button id="newChat" class="icon-button" type="button" aria-label="Nova conversa" title="Nova conversa">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-6M16 4l4 4M11 13l1-4 7-7 4 4-7 7-5 1Z" transform="translate(-1 0)" /></svg>
          </button>
        </div>
      </header>

      <main class="conversation" aria-label="Conversa">
        <div id="messages" tabindex="0" aria-label="Mensagens da conversa"></div>
        <div class="empty-state" aria-hidden="true">
          <span class="empty-mark">lumi<span>✦</span></span>
          <p>O que tens em mente?</p>
        </div>
      </main>

      <footer class="composer-area">
        <div class="activity-row">
          <p id="status" role="status" aria-live="polite" hidden></p>
          <button id="stopSpeech" type="button" disabled hidden>Parar voz</button>
        </div>
        <p id="error" role="alert"></p>
        <form id="chatForm" novalidate>
          <label class="sr-only" for="messageInput">Mensagem</label>
          <input id="messageInput" placeholder="Fala com a Lumi…" autocomplete="off" required />
          <div class="composer-actions">
            <button id="cancelCapture" type="button" disabled>Cancelar gravação</button>
            <button type="button" id="micButton" class="icon-button" aria-label="Gravar áudio" title="Gravar ou terminar gravação">🎙️</button>
            <button type="submit" id="sendButton" class="icon-button" aria-label="Enviar mensagem" title="Enviar mensagem">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 12 6-6 6 6M12 6v13" /></svg>
            </button>
          </div>
        </form>
      </footer>
    </div>
    <script src="/chat.js" defer></script>
  </body>
</html>
