<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171b21" />
    <title>Lumi</title>
    <link rel="stylesheet" href="/chat.css" />
  </head>
  <body>
    <div class="lumi-shell">
      <header class="app-header">
        <a class="brand" href="/chat.html" aria-label="Lumi, início">lumi<span aria-hidden="true">✦</span></a>
        <button id="newChat" class="quiet-button" type="button" disabled>Nova conversa</button>
      </header>
      <main class="voice-workspace">
        <section class="conversation-module" aria-labelledby="presenceTitle">
          <div class="presence">
            <h1 id="presenceTitle" class="sr-only">Conversar com a Lumi</h1>
            <div class="mascot-stage" aria-label="Mascote Lumi">
              <div id="mascot-container"><canvas id="mascote" width="400" height="400"></canvas></div>
            </div>
            <div class="voice-console">
              <div class="voice-state" aria-live="polite" aria-atomic="true">
                <span class="state-signal" aria-hidden="true"></span>
                <p id="status" role="status">Parado</p>
              </div>
              <p id="error" role="alert"></p>
              <div class="mode-switch" role="group" aria-label="Modo de voz">
                <button id="liveMode" type="button" aria-pressed="true" disabled><strong>Ao vivo</strong><span>Deteta, envia e responde</span></button>
                <button id="approvalMode" type="button" aria-pressed="false" disabled><strong>Com aprovação</strong><span>Revê antes de enviar</span></button>
              </div>
              <div class="primary-controls">
                <button id="listenButton" class="listen-button" type="button" disabled><span aria-hidden="true"></span>Iniciar escuta</button>
                <div class="voice-utilities">
                  <button id="stopSpeech" class="quiet-button" type="button" disabled hidden>Parar voz</button>
                  <button id="voiceToggle" class="quiet-button" type="button" aria-pressed="false" disabled>Resposta silenciosa</button>
                </div>
              </div>
              <p id="modeHint" class="mode-hint">A escuta só começa quando ativares o microfone.</p>
              <nav class="panel-controls" aria-label="Painéis da conversa">
                <button id="transcriptToggle" type="button" aria-expanded="false" aria-controls="transcriptPanel" disabled>Transcrição</button>
                <button id="textToggle" type="button" aria-expanded="false" aria-controls="textPanel" disabled>Escrever</button>
              </nav>
            </div>
          </div>
          <div class="conversation-panels" aria-label="Conteúdo da conversa">
            <section id="transcriptPanel" class="tool-panel transcript-panel" hidden>
              <div class="panel-heading">
                <div><p class="eyebrow">Conversa atual</p><h2>Transcrição</h2></div>
                <span id="messageCount" aria-live="polite"></span>
              </div>
              <div id="messages" tabindex="0" aria-label="Mensagens da conversa"></div>
              <div class="empty-state"><p>A conversa aparecerá aqui.</p></div>
            </section>
            <section id="textPanel" class="tool-panel text-panel" hidden>
              <div class="panel-heading">
                <div><p class="eyebrow">Entrada opcional</p><h2 id="composerTitle">Escrever mensagem</h2></div>
              </div>
              <form id="chatForm" novalidate>
                <label for="messageInput">Mensagem</label>
                <textarea id="messageInput" class="resize-none" rows="3" placeholder="Escreve ou revê a transcrição…" autocomplete="off" required></textarea>
                <div class="composer-actions">
                  <button id="cancelCapture" class="quiet-button danger-text" type="button" disabled>Cancelar gravação</button>
                  <button id="micButton" class="quiet-button" type="button" aria-label="Gravar áudio" disabled>Gravar para rever</button>
                  <button id="sendButton" class="send-button" type="submit">Enviar mensagem</button>
                </div>
              </form>
            </section>
          </div>
        </section>
      </main>
    </div>
    <script src="/chat.js" defer></script>
    <script src="https://unpkg.com/@rive-app/canvas" defer></script>
    <script src="/mascot.js" defer></script>
  </body>
</html>
